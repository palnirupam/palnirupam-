<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">AI and Machine Learning, Development, Cybersecurity</title>
  <desc id="desc">Three side-by-side cards with chrome-gradient headings, sweeping light, a flowing neural network, revealing code and a scanning digital shield. Skills include AI and language models, Python, PyTorch, Java, C, web development, Linux, CTFs and ethical hacking.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#0C1428"/><stop offset="1" stop-color="#060A18"/>
    </linearGradient>
    <linearGradient id="title-ink"><stop stop-color="#67E8F9"/><stop offset=".32" stop-color="#C4F1FF"/><stop offset=".64" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="glass-sheen"><stop stop-color="#F8FAFC" stop-opacity="0"/><stop offset=".5" stop-color="#F8FAFC" stop-opacity=".13"/><stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/></linearGradient>
    <filter id="title-depth" x="-10%" y="-30%" width="120%" height="165%">
      <feOffset in="SourceAlpha" dx="0" dy="2" result="depth"/>
      <feFlood flood-color="#263266" flood-opacity=".9"/>
      <feComposite in2="depth" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card-clip"><rect width="384" height="236" rx="18"/></clipPath>
    <linearGradient id="cyan-line"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <linearGradient id="violet-line"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
    <linearGradient id="magenta-line"><stop stop-color="#F472B6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient>
    <radialGradient id="cyan-halo"><stop stop-color="#22D3EE" stop-opacity=".15"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet-halo"><stop stop-color="#A78BFA" stop-opacity=".15"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="magenta-halo"><stop stop-color="#F472B6" stop-opacity=".14"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#CBD5E1" opacity=".1"/></pattern>
    <clipPath id="code-clip"><rect class="code-mask" x="16" y="36" width="290" height="54"/></clipPath>
    <clipPath id="shield-clip"><path d="M96 22L132 35V65C132 91 116 108 96 118C76 108 60 91 60 65V35Z"/></clipPath>

  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", Consolas, monospace; }
    .trace { stroke-dasharray: 72 1400; animation: trace 12s linear infinite; }
    .trace-two { animation-delay: -4s; }
    .trace-three { animation-delay: -8s; }
    .flow { stroke-dasharray: 4 12; animation: flow 3s linear infinite; }
    .node { animation: pulse 3s ease-in-out infinite; }
    .late { animation-delay: -1.5s; }
    .code-mask { animation: reveal 8s steps(18, end) infinite; }
    .cursor { animation: cursor 2s ease-in-out infinite; }
    .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 12s linear infinite; }
    .reverse { animation-direction: reverse; animation-duration: 24s; }
    .scan { animation: scan 6s ease-in-out infinite; }
    .glint { animation: glint 8s ease-in-out infinite; }
    .glint-two { animation-delay: -2s; }
    .glint-three { animation-delay: -4s; }
    .halo { animation: halo 6s ease-in-out infinite; }
    @keyframes glint { 0%, 18% { transform: translateX(0); } 72%, 100% { transform: translateX(1020px); } }
    @keyframes halo { 0%, 100% { opacity: .4; } 50% { opacity: .95; } }
    @keyframes trace { to { stroke-dashoffset: -1472; } }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes pulse { 0%, 100% { opacity: .42; } 50% { opacity: 1; } }
    @keyframes reveal { 0%, 10% { width: 0; } 55%, 88% { width: 290px; } 100% { width: 0; } }
    @keyframes cursor { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes scan { 0%, 100% { transform: translateY(-43px); opacity: .25; } 50% { transform: translateY(43px); opacity: .95; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .flow, .node, .code-mask, .cursor, .orbit, .scan, .glint, .halo { animation: none; }
    }

  </style>
  <g transform="translate(12 12)">
    <rect width="384" height="236" rx="18" fill="url(#panel)" stroke="#22D3EE" stroke-opacity=".27"/>
    <rect x="1" y="1" width="382" height="234" rx="17" fill="url(#dots)"/>
    <g clip-path="url(#card-clip)">
      <circle class="halo" cx="292" cy="75" r="190" fill="url(#cyan-halo)" opacity=".6"/>
      <g transform="skewX(-18)"><rect class="glint" x="-220" y="-40" width="140" height="330" fill="url(#glass-sheen)"/></g>
    </g>
    <rect class="trace " x="1" y="1" width="382" height="234" rx="17" fill="none" stroke="#22D3EE" stroke-width="1.4" opacity=".75"/>
    <path d="M24 1H360" stroke="url(#cyan-line)" stroke-width="2"/>
    <text x="24" y="33" fill="#22D3EE" font-size="13" font-weight="700" letter-spacing="1">01</text>
    <text x="54" y="33" fill="#94A3B8" font-size="10" font-weight="600" letter-spacing="2">INTELLIGENCE</text><g transform="translate(179 24) scale(.94)">
      <circle cx="96" cy="66" r="88" fill="url(#cyan-halo)"/>
      <circle cx="96" cy="66" r="59" fill="none" stroke="#22D3EE" opacity=".13"/>
      <path d="M36 37L76 16L117 21L156 47L149 90L107 119L57 105L32 73Z M36 37L96 66L117 21 M76 16L96 66L156 47 M32 73L96 66L149 90 M57 105L96 66L107 119" fill="none" stroke="#22D3EE" stroke-width="1.3" opacity=".24"/>
      <path class="flow" d="M36 37L96 66L117 21 M76 16L96 66L156 47 M32 73L96 66L149 90 M57 105L96 66L107 119" fill="none" stroke="#67E8F9" stroke-width="1.8" opacity=".9"/>
      <g fill="#22D3EE">
        <circle class="node" cx="36" cy="37" r="4.5"/><circle class="node late" cx="76" cy="16" r="4.5"/>
        <circle class="node" cx="117" cy="21" r="4.5"/><circle class="node late" cx="156" cy="47" r="4.5"/>
        <circle class="node" cx="149" cy="90" r="4.5"/><circle class="node late" cx="107" cy="119" r="4.5"/>
        <circle class="node" cx="57" cy="105" r="4.5"/><circle class="node late" cx="32" cy="73" r="4.5"/>
      </g>
      <circle cx="96" cy="66" r="13" fill="#071723" stroke="#22D3EE" stroke-width="1.5"/>
      <circle class="node" cx="96" cy="66" r="6" fill="#67E8F9"/>
      <circle class="node late" cx="96" cy="66" r="20" fill="none" stroke="#22D3EE" opacity=".35"/>
    </g><text x="24" y="116" fill="url(#title-ink)" filter="url(#title-depth)" stroke="#E0F2FE" stroke-opacity=".24" stroke-width=".3" font-size="54" font-weight="700" letter-spacing="-2">AI</text>
      <text x="24" y="186" fill="url(#title-ink)" filter="url(#title-depth)" stroke="#E0F2FE" stroke-opacity=".24" stroke-width=".3" font-size="24" font-weight="700" letter-spacing="-.6">AI / MACHINE LEARNING</text>
      <text x="24" y="216" fill="#CBD5E1" font-size="14">Python · PyTorch · language models</text>
  </g>
  <g transform="translate(408 12)">
    <rect width="384" height="236" rx="18" fill="url(#panel)" stroke="#A78BFA" stroke-opacity=".27"/>
    <rect x="1" y="1" width="382" height="234" rx="17" fill="url(#dots)"/>
    <g clip-path="url(#card-clip)">
      <circle class="halo" cx="292" cy="75" r="190" fill="url(#violet-halo)" opacity=".6"/>
      <g transform="skewX(-18)"><rect class="glint glint-two" x="-220" y="-40" width="140" height="330" fill="url(#glass-sheen)"/></g>
    </g>
    <rect class="trace trace-two" x="1" y="1" width="382" height="234" rx="17" fill="none" stroke="#A78BFA" stroke-width="1.4" opacity=".75"/>
    <path d="M24 1H360" stroke="url(#violet-line)" stroke-width="2"/>
    <text x="24" y="33" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="1">02</text>
    <text x="54" y="33" fill="#94A3B8" font-size="10" font-weight="600" letter-spacing="2">ENGINEERING</text><g transform="translate(24 51)">
      <rect width="336" height="99" rx="10" fill="#080D1D" stroke="#A78BFA" stroke-opacity=".25"/>
      <path d="M0 25H336" stroke="#A78BFA" opacity=".15"/>
      <circle cx="15" cy="13" r="3" fill="#F472B6"/><circle cx="26" cy="13" r="3" fill="#A78BFA"/><circle cx="37" cy="13" r="3" fill="#22D3EE"/>
      <text class="mono" x="241" y="17" fill="#94A3B8" font-size="9">build.py</text>
      <g clip-path="url(#code-clip)" class="mono" font-size="14">
        <text x="16" y="53" fill="#A78BFA">def <tspan fill="#F1F5F9">build</tspan><tspan fill="#22D3EE">(idea):</tspan></text>
        <text x="32" y="76" fill="#F472B6">return <tspan fill="#F1F5F9">idea</tspan></text>
      </g>
      <rect class="cursor" x="144" y="63" width="7" height="15" fill="#A78BFA" opacity=".8"/>
      <text class="mono" x="268" y="76" fill="#A78BFA" font-size="25" font-weight="700">&lt;/&gt;</text>
    </g>
    
      <text x="24" y="186" fill="url(#title-ink)" filter="url(#title-depth)" stroke="#E0F2FE" stroke-opacity=".24" stroke-width=".3" font-size="27" font-weight="700" letter-spacing="-.6">DEVELOPMENT</text>
      <text x="24" y="216" fill="#CBD5E1" font-size="14">Python · Java · C · web development</text>
  </g>
  <g transform="translate(804 12)">
    <rect width="384" height="236" rx="18" fill="url(#panel)" stroke="#F472B6" stroke-opacity=".27"/>
    <rect x="1" y="1" width="382" height="234" rx="17" fill="url(#dots)"/>
    <g clip-path="url(#card-clip)">
      <circle class="halo" cx="292" cy="75" r="190" fill="url(#magenta-halo)" opacity=".6"/>
      <g transform="skewX(-18)"><rect class="glint glint-three" x="-220" y="-40" width="140" height="330" fill="url(#glass-sheen)"/></g>
    </g>
    <rect class="trace trace-three" x="1" y="1" width="382" height="234" rx="17" fill="none" stroke="#F472B6" stroke-width="1.4" opacity=".75"/>
    <path d="M24 1H360" stroke="url(#magenta-line)" stroke-width="2"/>
    <text x="24" y="33" fill="#F472B6" font-size="13" font-weight="700" letter-spacing="1">03</text>
    <text x="54" y="33" fill="#94A3B8" font-size="10" font-weight="600" letter-spacing="2">SECURITY</text><g transform="translate(182 22) scale(.96)">
      <circle cx="96" cy="69" r="87" fill="url(#magenta-halo)"/>
      <g class="orbit">
        <circle cx="96" cy="69" r="66" fill="none" stroke="#F472B6" opacity=".08"/>
        <circle cx="96" cy="69" r="66" fill="none" stroke="#F472B6" stroke-width="1.8" stroke-dasharray="65 142" opacity=".75"/>
      </g>
      <g class="orbit reverse">
        <circle cx="96" cy="69" r="55" fill="none" stroke="#A78BFA" opacity=".08"/>
        <circle cx="96" cy="69" r="55" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-dasharray="32 83" opacity=".55"/>
      </g>
      <path d="M96 22L132 35V65C132 91 116 108 96 118C76 108 60 91 60 65V35Z" fill="#0D1429" stroke="#F472B6" stroke-width="1.6"/>
      <path d="M96 31L124 41V65C124 86 111 101 96 109C81 101 68 86 68 65V41Z" fill="none" stroke="#F472B6" opacity=".22"/>
      <g clip-path="url(#shield-clip)">
        <path d="M60 49H132M60 69H132M60 89H132M76 28V110M96 22V118M116 28V110" fill="none" stroke="#F472B6" opacity=".12"/>
        <path class="scan" d="M53 68H140" fill="none" stroke="#F9A8D4" stroke-width="2" opacity=".8"/>
      </g>
      <rect x="83" y="62" width="26" height="24" rx="5" fill="#172039" stroke="#F472B6"/>
      <path d="M88 62V56A8 8 0 0 1 104 56V62" fill="none" stroke="#F9A8D4" stroke-width="2"/>
      <circle class="node" cx="96" cy="72" r="2.5" fill="#F9A8D4"/>
      <path d="M96 74V78" stroke="#F9A8D4" stroke-width="2" stroke-linecap="round"/>
    </g><text class="mono" x="24" y="88" fill="#F9A8D4" font-size="13">root@kali</text><text class="mono" x="24" y="114" fill="#94A3B8" font-size="12">&gt; explore_</text>
      <text x="24" y="186" fill="url(#title-ink)" filter="url(#title-depth)" stroke="#E0F2FE" stroke-opacity=".24" stroke-width=".3" font-size="27" font-weight="700" letter-spacing="-.6">CYBERSECURITY</text>
      <text x="24" y="216" fill="#CBD5E1" font-size="14">Linux · CTFs · ethical hacking</text>
  </g>
</svg>
